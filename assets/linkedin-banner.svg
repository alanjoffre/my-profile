<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" role="img" aria-label="Alan Joffre — Engenheiro de Dados. Do lakehouse à IA aplicada, com qualidade medida. Databricks, dbt, Spark, Airflow, Python e SQL.">
